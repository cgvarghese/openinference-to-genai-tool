# OTel Collector (contrib) config: OpenInference spans -> Weave Agents endpoint.
# Adds gen_ai.* attributes alongside the original OpenInference ones (nothing is removed).
#
# Env: WANDB_API_KEY, WANDB_ENTITY, WANDB_PROJECT, AGENT_NAME (optional)

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

  transform/oi_to_genai:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # --- Operation type (drives Agents view rendering) ---
          # Root span = one turn; every AGENT span (incl. delegated sub-agents) is its own invoke_agent.
          - set(attributes["gen_ai.operation.name"], "invoke_agent") where parent_span_id == SpanID(0x0000000000000000)
          - set(attributes["gen_ai.operation.name"], "invoke_agent") where attributes["openinference.span.kind"] == "AGENT"
          - set(attributes["gen_ai.operation.name"], "chat") where attributes["openinference.span.kind"] == "LLM"
          - set(attributes["gen_ai.operation.name"], "execute_tool") where attributes["openinference.span.kind"] == "TOOL"
          # RETRIEVER has no GenAI equivalent: alias to a datastore tool call (span name = tool name).
          - set(attributes["gen_ai.operation.name"], "execute_tool") where attributes["openinference.span.kind"] == "RETRIEVER"
          - set(attributes["gen_ai.tool.type"], "function") where attributes["openinference.span.kind"] == "TOOL"
          - set(attributes["gen_ai.tool.type"], "datastore") where attributes["openinference.span.kind"] == "RETRIEVER"
          - set(attributes["gen_ai.tool.name"], name) where attributes["openinference.span.kind"] == "RETRIEVER" and attributes["tool.name"] == nil

          # --- Grouping ---
          - set(attributes["gen_ai.conversation.id"], attributes["session.id"]) where attributes["session.id"] != nil
          - set(attributes["gen_ai.agent.name"], attributes["agent.name"]) where attributes["agent.name"] != nil
          # LangGraph OI puts the agent name inside the `metadata` JSON string (needs a contrib build
          # that supports indexing converter results, v0.100+).
          - set(attributes["gen_ai.agent.name"], ParseJSON(attributes["metadata"])["agent.name"]) where attributes["gen_ai.agent.name"] == nil and attributes["openinference.span.kind"] == "AGENT" and attributes["metadata"] != nil
          - set(attributes["gen_ai.agent.name"], "${env:AGENT_NAME}") where attributes["gen_ai.agent.name"] == nil and parent_span_id == SpanID(0x0000000000000000)
          - set(attributes["gen_ai.agent.name"], name) where attributes["gen_ai.agent.name"] == nil and attributes["openinference.span.kind"] == "AGENT"

          # --- Enrichment (optional) ---
          - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["llm.model_name"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["llm.provider"]) where attributes["llm.provider"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["llm.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["llm.system"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["llm.token_count.prompt"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["llm.token_count.completion"] != nil
          - set(attributes["gen_ai.request.temperature"], ParseJSON(attributes["llm.invocation_parameters"])["temperature"]) where attributes["llm.invocation_parameters"] != nil
          - set(attributes["gen_ai.request.max_tokens"], ParseJSON(attributes["llm.invocation_parameters"])["max_tokens"]) where attributes["llm.invocation_parameters"] != nil
          - set(attributes["gen_ai.tool.name"], attributes["tool.name"]) where attributes["tool.name"] != nil
          - set(attributes["gen_ai.tool.description"], attributes["tool.description"]) where attributes["tool.description"] != nil
          # e.g. "UpstreamTimeoutError: core-banking ... timed out" -> "UpstreamTimeoutError"
          - set(attributes["error.type"], Split(status.message, ":")[0]) where status.code == STATUS_CODE_ERROR and status.message != ""

exporters:
  # Inspect transformed spans locally before trusting the output.
  debug:
    verbosity: detailed

  otlphttp/weave_agents:
    # traces_endpoint = full URL (endpoint would append /v1/traces).
    traces_endpoint: https://trace.wandb.ai/agents/otel/v1/traces
    encoding: proto
    headers:
      wandb-api-key: ${env:WANDB_API_KEY}
      project_id: ${env:WANDB_ENTITY}/${env:WANDB_PROJECT}

  # Optional: keep full OpenInference parsing in the Traces view at the same time.
  # Check ingestion/billing impact before enabling for a customer.
  otlphttp/weave_traces:
    traces_endpoint: https://trace.wandb.ai/otel/v1/traces
    encoding: proto
    headers:
      wandb-api-key: ${env:WANDB_API_KEY}
      project_id: ${env:WANDB_ENTITY}/${env:WANDB_PROJECT}

service:
  pipelines:
    traces/agents:
      receivers: [otlp]
      processors: [transform/oi_to_genai, batch]
      exporters: [debug, otlphttp/weave_agents]
    # Uncomment to dual-export untransformed spans to the Traces view:
    # traces/classic:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [otlphttp/weave_traces]